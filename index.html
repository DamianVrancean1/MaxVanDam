<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>piese-auto-app</title>
    <!-- FOUC prevention: runs before CSS paint and React mount -->
    <script>
      (function () {
        var saved = localStorage.getItem('colorTheme');
        var preferred = (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)
          ? 'light'
          : (saved || 'dark');
        document.documentElement.setAttribute('data-theme', preferred);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
